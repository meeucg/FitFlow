syntax = "proto3";

package feedcore.v1;

option csharp_namespace = "FitFlow.FeedCore.Grpc.Contracts";

import "google/protobuf/timestamp.proto";

service FeedCoreGateway {
  rpc AddNewUser(AddNewUserRequest) returns (UserStarterRecommendations);
  rpc GetJobPosting(GetJobPostingRequest) returns (JobPostingDisplay);
}

message AddNewUserRequest {
  string user_id = 1;
  InterviewConclusion interview_conclusion = 2;
}

message UserStarterRecommendations {
  repeated string recommendation_ids = 1;
}

message GetJobPostingRequest {
  string id = 1;
}

message InterviewConclusion {
  string cluster = 1;
  repeated Specialization specializations = 2;
  repeated Skill skills = 3;
  repeated Tool tools = 4;
  repeated Domain preferred_domains = 5;
}

message Specialization {
  string name = 1;
  repeated string alternative_names = 2;
}

message Skill {
  string display_name = 1;
  string description = 2;
  SkillDominanceLevel dominance_level = 3;
  repeated string alternative_names = 4;
}

message Tool {
  string tool_standard_name = 1;
  ToolUsageFrequency usage_frequency = 2;
  repeated string tool_alt_names = 3;
}

message Domain {
  string name = 1;
  repeated string alternative_names = 2;
}

enum SkillDominanceLevel {
  SKILL_DOMINANCE_LEVEL_UNSPECIFIED = 0;
  SKILL_DOMINANCE_LEVEL_CORE = 1;
  SKILL_DOMINANCE_LEVEL_IMPORTANT = 2;
  SKILL_DOMINANCE_LEVEL_SECONDARY = 3;
  SKILL_DOMINANCE_LEVEL_LIMITED = 4;
}

enum ToolUsageFrequency {
  TOOL_USAGE_FREQUENCY_UNSPECIFIED = 0;
  TOOL_USAGE_FREQUENCY_CORE = 1;
  TOOL_USAGE_FREQUENCY_REGULAR = 2;
  TOOL_USAGE_FREQUENCY_OCCASIONAL = 3;
  TOOL_USAGE_FREQUENCY_RARE = 4;
}

message JobPostingDisplay {
  string id = 1;
  string source = 2;
  google.protobuf.Timestamp posted_at = 3;
  string url = 4;

  optional string author = 5;
  optional string title = 6;
  optional string price_min = 7;
  optional string price_max = 8;
  Currency currency = 9;
  optional string description = 10;
  optional string cluster = 11;

  repeated PostingAttachment attached_files = 12;
  repeated JobPostingSpecialization specializations = 13;
  repeated JobPostingSkill required_skills = 14;
  repeated JobPostingSkill bonus_skills = 15;
  repeated JobPostingTool required_tools = 16;
  repeated JobPostingTool bonus_tools = 17;
  repeated JobPostingDomain domains = 18;
}

message PostingAttachment {
  optional string url = 1;
  optional string base64 = 2;
  string extension = 3;
}

message JobPostingSkill {
  string display_name = 1;
  string description = 2;
  repeated string alternative_names = 3;
}

message JobPostingTool {
  string tool_standard_name = 1;
  repeated string tool_alt_names = 2;
}

message JobPostingSpecialization {
  string name = 1;
  repeated string alternative_names = 2;
}

message JobPostingDomain {
  string name = 1;
  repeated string alternative_names = 2;
}

enum Currency {
  CURRENCY_UNSPECIFIED = 0;
  CURRENCY_RUB = 1;
  CURRENCY_USD = 2;
  CURRENCY_EUR = 3;
}
